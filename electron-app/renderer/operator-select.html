<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'">
  <title>JML Fleet - Select Operator</title>
  <script src="theme-bootstrap.js"></script>
  <style>
    @font-face { font-family: 'Geist'; src: url('fonts/geist-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Geist'; src: url('fonts/geist-500.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'Geist'; src: url('fonts/geist-600.woff2') format('woff2'); font-weight: 600; font-display: swap; }
    @font-face { font-family: 'JetBrains Mono'; src: url('fonts/jbmono-500.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    :root {
      --bg: oklch(0.16 0.012 252);
      --bg-2: oklch(0.18 0.014 252);
      --surface: oklch(0.205 0.016 252);
      --border: oklch(0.31 0.022 252);
      --border-strong: oklch(0.40 0.030 252);
      --text: oklch(0.97 0.005 252);
      --text-2: oklch(0.78 0.010 252);
      --muted: oklch(0.58 0.014 252);
      --cyan: oklch(0.82 0.14 195);
      --cyan-dim: oklch(0.55 0.12 195);
      --coral: oklch(0.70 0.20 24);
      --emerald: oklch(0.78 0.16 155);
      --violet: oklch(0.74 0.14 280);
      --mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', ui-monospace, monospace;
      --sans: 'Geist', 'Inter', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background:
        radial-gradient(800px 500px at 8% -10%, oklch(0.24 0.05 230 / .4), transparent 60%),
        radial-gradient(700px 400px at 105% 100%, oklch(0.22 0.06 280 / .3), transparent 55%),
        var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex; align-items: center; justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 30px;
      width: 380px;
      display: flex; flex-direction: column; gap: 18px;
      -webkit-app-region: no-drag;
      box-shadow: 0 30px 80px oklch(0 0 0 / .55);
    }
    /* Always-visible exit on the launch screen - this window is frameless, so
       without it there's no way to quit before signing in. */
    .op-exit {
      position: fixed; top: 12px; right: 14px; z-index: 50;
      width: 28px; height: 26px; display: grid; place-items: center;
      -webkit-app-region: no-drag;
      background: transparent; border: 0; border-radius: 5px; cursor: pointer;
      color: var(--muted); font-size: 13px; line-height: 1;
      transition: background 150ms ease, color 150ms ease;
    }
    .op-exit:hover { background: var(--coral, #e5484d); color: #fff; }
    .brand-row { display: flex; align-items: center; gap: 12px; }
    .seal {
      width: 38px; height: 38px; border-radius: 10px;
      background: conic-gradient(from 220deg at 50% 50%, var(--cyan), var(--violet), var(--coral), var(--cyan));
      position: relative;
      box-shadow: 0 0 0 1px oklch(0.4 0.02 252 / .8);
      flex-shrink: 0;
    }
    .seal::after { content: ""; position: absolute; inset: 4px; border-radius: 7px; background: var(--bg-2); }
    .seal::before {
      content: ""; position: absolute; inset: 10px; border-radius: 4px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform: scale(.9); } }
    /* Glass-theme brand mark: SVG with a genuinely transparent ring between
       frame and core (fill="none") - the page background shows through.
       Warm/Preview keep the .seal treatment untouched. No animation in Glass. */
    .seal-glass { display: none; width: 38px; height: 38px; flex-shrink: 0; }
    [data-theme="glass"] .seal { display: none; }
    [data-theme="glass"] .seal-glass {
      display: block;
      filter: drop-shadow(0 0 7px rgba(89, 218, 239, .24));
    }
    .brand-title { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
    .brand-sub { font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: .04em; text-transform: uppercase; margin-top: 2px; }
    .divider { height: 1px; background: var(--border); }
    .prompt { font-size: 12.5px; color: var(--text-2); }
    /* 2px padding so the 1px hover lift on .op-btn isn't clipped by the scroll container */
    .operator-list { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; padding: 2px; }
    .operator-list::-webkit-scrollbar { width: 6px; }
    .operator-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
    .op-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s;
      color: inherit; font-family: inherit; font-size: 13px;
      width: 100%; text-align: left;
    }
    .op-btn:hover { border-color: var(--cyan-dim); background: oklch(0.22 0.04 200 / .25); transform: translateY(-1px); }
    .op-btn.selected { border-color: var(--cyan); }
    .op-av {
      width: 32px; height: 32px; border-radius: 8px;
      display: grid; place-items: center;
      font-weight: 600; font-size: 11px;
      border: 1px solid var(--border-strong);
      background: linear-gradient(135deg, oklch(0.55 0.12 195), oklch(0.40 0.12 280));
      color: #fff;
      flex-shrink: 0;
    }
    .op-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    .op-name { font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .op-domain { font-family: var(--mono); font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .op-role {
      font-family: var(--mono); font-size: 10px;
      padding: 2px 7px; border-radius: 4px;
      letter-spacing: .08em; text-transform: uppercase;
      border: 1px solid; width: fit-content; margin-left: auto; align-self: center;
    }
    .role-admin    { color: var(--cyan);    border-color: oklch(0.55 0.12 195 / .45); background: oklch(0.55 0.12 195 / .08); }
    .role-helpdesk { color: var(--emerald); border-color: oklch(0.50 0.13 155 / .45); background: oklch(0.50 0.13 155 / .08); }
    .role-viewer   { color: var(--text-2);  border-color: var(--border-strong);        background: oklch(0.27 0.02 252); }
    .role-other    { color: var(--muted);   border-color: var(--border-strong);        background: oklch(0.27 0.02 252); }
    .guest-row { display: flex; align-items: center; gap: 8px; }
    .guest-divider { flex: 1; height: 1px; background: var(--border); }
    .guest-label { font-size: 10px; color: var(--muted); font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .btn-continue {
      padding: 9px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-2);
      font-family: inherit; font-size: 12px;
      width: 100%; text-align: center;
      transition: border-color .15s, color .15s, background .15s;
    }
    .btn-continue:hover { border-color: var(--border-strong); color: var(--text); background: var(--bg-2); }
    .btn-entra {
      color: var(--text); border-color: var(--cyan-dim);
      background: linear-gradient(135deg, oklch(0.30 0.06 200 / .55), oklch(0.28 0.06 280 / .45));
      font-weight: 600; font-size: 13px; padding: 11px 14px;
    }
    .btn-entra:hover { border-color: var(--cyan); background: linear-gradient(135deg, oklch(0.34 0.07 200 / .65), oklch(0.32 0.07 280 / .55)); color: var(--text); }
    .btn-entra:disabled { opacity: .55; cursor: default; }
    .entra-status {
      font-family: var(--mono); font-size: 11px; color: var(--text-2);
      padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg-2); line-height: 1.6; word-break: break-all;
    }
    .entra-status b.entra-code {
      color: var(--cyan); font-size: 14px; letter-spacing: .15em;
      user-select: text; -webkit-user-select: text;
    }
    .entra-status.err { color: var(--coral); border-color: oklch(0.45 0.16 24 / .45); }
    .no-ops { font-size: 12px; color: var(--muted); text-align: center; padding: 14px; }
    /* PIN gate dialog */
    .pin-gate-overlay {
      position: fixed; inset: 0; background: oklch(0 0 0 / .7); backdrop-filter: blur(4px);
      z-index: 100; display: flex; align-items: center; justify-content: center;
    }
    .pin-gate { width: 360px; max-width: 92vw; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .pin-gate h3 { font-size: 14px; font-weight: 600; margin: 0; }
    .pin-gate .sub { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .pin-gate-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pin-gate-choice button {
      padding: 12px 10px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); cursor: pointer; font-family: inherit; font-size: 13px;
      display: flex; flex-direction: column; gap: 4px; align-items: center;
    }
    .pin-gate-choice button:hover { border-color: var(--cyan-dim); }
    .pin-gate-choice button .label { font-weight: 600; }
    .pin-gate-choice button .desc { font-size: 11px; color: var(--muted); }
    .pin-gate input { padding: 10px 12px; font-family: var(--mono); font-size: 16px;
      background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); letter-spacing: .3em; text-align: center;
    }
    .pin-gate input:focus { border-color: var(--cyan-dim); outline: 0; }
    .pin-gate-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .pin-gate-actions button { padding: 7px 14px; border-radius: 7px; font-size: 12.5px; cursor: pointer; }
    .pin-gate-actions .btn-cancel { background: transparent; color: var(--text-2); border: 1px solid var(--border); }
    .pin-gate-actions .btn-ok { background: var(--cyan); color: oklch(0.14 0.02 220); border: 0; font-weight: 600; }
    .pin-gate-error { font-size: 11px; color: var(--coral); font-family: var(--mono); min-height: 14px; }
    .win-map {
      margin-top: 4px; padding: 8px 10px;
      border: 1px solid var(--border); border-radius: 7px;
      background: var(--bg-2);
      font-family: var(--mono); font-size: 10.5px; color: var(--text-2);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .win-map .k { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 9px; }
    .win-map .arrow { color: var(--muted); }
    .win-map b { color: var(--text); }
  </style>
</head>
<body>
  <button class="op-exit" id="op-exit" type="button" title="Exit console" aria-label="Exit console">&#x2715;</button>
  <div class="card">
    <div class="brand-row">
      <div class="seal"></div>
      <svg class="seal-glass" width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">
        <defs>
          <linearGradient id="glass-frame-oobe-opsel" x1="3" y1="3" x2="35" y2="35" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#55eadf"/>
            <stop offset=".54" stop-color="#72a7ff"/>
            <stop offset="1" stop-color="#bd7eff"/>
          </linearGradient>
          <linearGradient id="glass-core-oobe-opsel" x1="11" y1="11" x2="27" y2="27" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#62e9df"/>
            <stop offset=".62" stop-color="#8f8cff"/>
            <stop offset="1" stop-color="#c57dff"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="34" height="34" rx="10" fill="none" stroke="url(#glass-frame-oobe-opsel)" stroke-width="3"/>
        <rect x="4" y="4" width="30" height="30" rx="8" fill="none" stroke="rgba(224,245,255,.28)" stroke-width=".75"/>
        <rect x="11" y="11" width="16" height="16" rx="5" fill="url(#glass-core-oobe-opsel)"/>
      </svg>
      <div>
        <div class="brand-title">JML Fleet Console</div>
        <div class="brand-sub">Identity Lifecycle Management</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="prompt">Who is operating this session? All actions will be signed with this identity's certificate and recorded to the audit chain.</div>
    <button class="btn-continue btn-entra" id="btn-entra">
      <svg viewBox="0 0 21 21" width="13" height="13" style="vertical-align:-2px;margin-right:7px"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
      Sign in with Microsoft Entra ID
    </button>
    <div class="entra-status" id="entra-status" style="display:none"></div>
    <div class="guest-row">
      <div class="guest-divider"></div>
      <span class="guest-label">or select a local operator</span>
      <div class="guest-divider"></div>
    </div>
    <div class="operator-list" id="operator-list">
      <div class="no-ops">Loading operators…</div>
    </div>
    <button class="btn-continue" id="btn-guest">Continue as <span id="guest-name">guest</span></button>
  </div>

  <script src="operator-select.js"></script>
</body>
</html>
