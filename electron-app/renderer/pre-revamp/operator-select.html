<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>JML Fleet — Select Operator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0d0f14;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
    }
    .card {
      background: #151820;
      border: 1px solid #2a2f3e;
      border-radius: 12px;
      padding: 32px 36px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      -webkit-app-region: no-drag;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .brand-title {
      font-size: 17px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.3px;
    }
    .brand-sub {
      font-size: 12px;
      color: #64748b;
    }
    .divider {
      height: 1px;
      background: #2a2f3e;
    }
    .prompt {
      font-size: 13px;
      color: #94a3b8;
    }
    .operator-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
    }
    .operator-list::-webkit-scrollbar { width: 4px; }
    .operator-list::-webkit-scrollbar-track { background: transparent; }
    .operator-list::-webkit-scrollbar-thumb { background: #2a2f3e; border-radius: 2px; }
    .op-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #1e2330;
      border: 1px solid #2a2f3e;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      color: inherit;
      font-family: inherit;
      font-size: 13px;
      width: 100%;
      text-align: left;
    }
    .op-btn:hover {
      border-color: #4f80ff;
      background: #1a2040;
    }
    .op-btn.selected {
      border-color: #4f80ff;
      background: #1a2040;
    }
    .op-name { font-weight: 500; color: #f1f5f9; }
    .op-role {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .role-admin    { background: rgba(79,128,255,0.15); color: #4f80ff; }
    .role-helpdesk { background: rgba(34,197,94,0.12);  color: #22c55e; }
    .role-viewer   { background: rgba(100,116,139,0.15); color: #94a3b8; }
    .role-other    { background: rgba(100,116,139,0.15); color: #94a3b8; }
    .guest-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .guest-divider {
      flex: 1;
      height: 1px;
      background: #2a2f3e;
    }
    .guest-label { font-size: 11px; color: #475569; }
    .btn-continue {
      padding: 10px 14px;
      background: transparent;
      border: 1px solid #2a2f3e;
      border-radius: 8px;
      cursor: pointer;
      color: #64748b;
      font-family: inherit;
      font-size: 12px;
      width: 100%;
      text-align: center;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-continue:hover { border-color: #475569; color: #94a3b8; }
    .no-ops {
      font-size: 12px;
      color: #475569;
      text-align: center;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-title">JML Fleet Console</div>
      <div class="brand-sub">Identity Lifecycle Management</div>
    </div>
    <div class="divider"></div>
    <div class="prompt">Who is operating this session?</div>
    <div class="operator-list" id="operator-list">
      <div class="no-ops">Loading operators…</div>
    </div>
    <div class="guest-row">
      <div class="guest-divider"></div>
      <span class="guest-label">or</span>
      <div class="guest-divider"></div>
    </div>
    <button class="btn-continue" id="btn-guest">Continue as <span id="guest-name">guest</span></button>
  </div>

  <script>
    const roleClass = r => {
      if (!r) return 'role-other';
      const l = r.toLowerCase();
      if (l === 'admin')    return 'role-admin';
      if (l === 'helpdesk') return 'role-helpdesk';
      if (l === 'viewer')   return 'role-viewer';
      return 'role-other';
    };

    window.api.getOperatorsForLogin().then(data => {
      const list = document.getElementById('operator-list');
      const ops  = data.operators || {};
      const entries = Object.entries(ops);

      if (!entries.length) {
        list.innerHTML = '<div class="no-ops">No operators configured — see Settings.</div>';
        return;
      }

      list.innerHTML = entries.map(([name, role]) =>
        `<button class="op-btn" data-name="${name}" data-role="${role || ''}">
          <span class="op-name">${name}</span>
          <span class="op-role ${roleClass(role)}">${role || 'user'}</span>
        </button>`
      ).join('');

      list.querySelectorAll('.op-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          window.api.selectOperator(btn.dataset.name, btn.dataset.role);
        });
      });
    }).catch(() => {
      document.getElementById('operator-list').innerHTML =
        '<div class="no-ops">Could not load operators.</div>';
    });

    document.getElementById('guest-name').textContent = window.api.currentUser;
    document.getElementById('btn-guest').addEventListener('click', () => {
      window.api.selectOperator(window.api.currentUser, 'guest');
    });
  </script>
</body>
</html>
