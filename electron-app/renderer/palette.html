<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'">
<title>JML Palette</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      oklch(0.13 0.010 252);
    --bg-2:    oklch(0.16 0.010 252);
    --border:  oklch(0.26 0.010 252);
    --text:    oklch(0.94 0.005 252);
    --text-2:  oklch(0.72 0.008 252);
    --muted:   oklch(0.52 0.008 252);
    --dim:     oklch(0.38 0.006 252);
    --cyan:    oklch(0.80 0.14 200);
    --coral:   oklch(0.70 0.20 24);
    --coral-dim: oklch(0.45 0.16 24);
    --amber:   oklch(0.78 0.16 75);
    --emerald: oklch(0.75 0.17 155);
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
  }
  html, body { height: 100%; background: transparent; }
  body {
    font-family: var(--sans);
    color: var(--text);
    display: flex; flex-direction: column;
  }

  .palette-shell {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 32px 80px rgb(0 0 0 / .65), 0 0 0 1px rgb(255 255 255 / .04) inset;
    overflow: hidden;
    display: flex; flex-direction: column;
  }

  .search-row {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
  }
  .search-icon { color: var(--muted); flex-shrink: 0; }
  .search-input {
    flex: 1; background: transparent; border: none; outline: none;
    font-family: var(--sans); font-size: 15px; color: var(--text);
    caret-color: var(--cyan);
  }
  .search-input::placeholder { color: var(--dim); }
  .esc-hint {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--bg-2); white-space: nowrap;
  }

  .divider { height: 1px; background: var(--border); }

  .results { max-height: 360px; overflow-y: auto; }
  .result-group-label {
    padding: 8px 16px 4px;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim);
  }
  .result-item {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 16px; cursor: pointer;
    color: var(--text-2);
  }
  .result-item:hover, .result-item.active { background: var(--bg-2); color: var(--text); }
  .result-icon {
    width: 30px; height: 30px; border-radius: 7px;
    display: grid; place-items: center; flex-shrink: 0;
    background: var(--bg-2); border: 1px solid var(--border);
    font-size: 12px;
  }
  .result-item.active .result-icon { background: color-mix(in oklch, var(--cyan) 10%, transparent); border-color: color-mix(in oklch, var(--cyan) 40%, transparent); color: var(--cyan); }
  .result-label { flex: 1; font-size: 13.5px; }
  .result-meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .result-upn { font-family: var(--mono); font-size: 10.5px; color: var(--dim); margin-top: 1px; }

  /* Action chips shown when a user is selected */
  .action-strip {
    display: flex; padding: 10px 16px; gap: 8px;
    border-top: 1px solid var(--border); flex-wrap: wrap;
  }
  .action-chip {
    flex: 1; min-width: 100px; padding: 8px 0; border-radius: 8px;
    font-size: 12px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg-2); color: var(--text-2);
    text-align: center;
  }
  .action-chip:hover { background: color-mix(in oklch, var(--cyan) 8%, transparent); border-color: color-mix(in oklch, var(--cyan) 40%, transparent); color: var(--cyan); }
  .action-chip.soft { color: var(--coral); border-color: color-mix(in oklch, var(--coral) 40%, transparent); }
  .action-chip.soft:hover { background: color-mix(in oklch, var(--coral) 8%, transparent); }
  .action-chip.hard { background: var(--coral-dim); color: #fff; border-color: var(--coral-dim); font-weight: 600; }
  .action-chip.hard:hover { background: var(--coral); border-color: var(--coral); }

  .footer-hint {
    display: flex; gap: 14px; padding: 8px 16px;
    border-top: 1px solid var(--border);
    font-family: var(--mono); font-size: 9.5px; color: var(--dim);
  }
  .footer-hint kbd {
    font-family: var(--mono); font-size: 9px;
    padding: 1px 5px; border-radius: 3px;
    border: 1px solid var(--border); background: var(--bg-2);
    color: var(--text-2); margin-right: 3px;
  }

  .empty-hint { padding: 20px 16px; text-align: center; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<div class="palette-shell" id="shell">
  <div class="search-row">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="search-input" placeholder="Search user or run command…" autocomplete="off" spellcheck="false">
    <span class="esc-hint">Esc</span>
  </div>
  <div class="divider"></div>
  <div class="results" id="results">
    <div class="result-group-label">Actions</div>
    <div class="result-item active" data-action="approvals">
      <div class="result-icon">⏳</div>
      <div style="flex:1"><div class="result-label">View Pending Approvals</div></div>
    </div>
    <div class="result-item" data-action="audit-log">
      <div class="result-icon">🔗</div>
      <div style="flex:1"><div class="result-label">Open Audit Log</div></div>
    </div>
    <div class="result-item" data-action="dashboard">
      <div class="result-icon">📊</div>
      <div style="flex:1"><div class="result-label">Open Dashboard</div></div>
    </div>
  </div>
  <div class="footer-hint">
    <span><kbd>↑↓</kbd> navigate</span>
    <span><kbd>↵</kbd> select</span>
    <span><kbd>Esc</kbd> close</span>
  </div>
</div>
<script src="palette.js"></script>
</body>
</html>
